<style>
:root {
  color-scheme: dark;
  --bg: #191919; --panel: #232323; --line: #3a3a3a; --text: #f2f2f2; --muted: #a3a3a3;
  --blue: #194bfd; --link: #6b89ff; --gold: #fbc27b;
  --head: "Space Grotesk", sans-serif;
  font: 16px/1.5 "Inclusive Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
  background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px);
  background-size: 32px 32px;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }

header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
header svg { width: 52px; height: auto; flex: none; }
header { padding-bottom: 16px; border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, var(--blue), var(--gold)) 1; }
::selection { background: var(--gold); color: #191919; }
h1 { margin: 0; font: 700 1.5rem var(--head); letter-spacing: .08em; text-transform: uppercase; }
h1 span { color: var(--gold); }
.status { margin-left: auto; font: 600 .75rem var(--head); letter-spacing: .12em; color: var(--muted); }
.status::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--gold); animation: blink 1.4s steps(2) infinite; }
.status.ok::before { background: #7bc47f; animation: none; }
@keyframes blink { 50% { opacity: .2; } }

.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; flex: 1 1 100%; font: 600 .9rem var(--head); }
nav a { padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
nav a:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
nav a:last-child { background: var(--blue); border-color: var(--blue); color: #fff; }
nav i { color: var(--gold); font-style: normal; }
input, button {
  font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px;
}
input { flex: 1; min-width: 0; }
input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px #194bfd55; }
input[aria-invalid=true] { border-color: #e56a6a; }
button { cursor: pointer; font-family: var(--head); font-weight: 600; background: var(--blue); border-color: var(--blue); color: #fff; border-radius: 8px; transition: background .15s; }
button:hover:not(:disabled) { background: #3f6bfd; }
button:disabled { opacity: .35; cursor: default; }

.table { border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 12px; background: var(--panel); position: relative; }
.table::before, .table::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--gold); pointer-events: none; }
.table::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
.table::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
.row { display: grid; grid-template-columns: 1fr 90px 130px; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border: 0; }
a.row:hover { background: #194bfd33; box-shadow: inset 3px 0 var(--gold); }
a.row:hover .name { color: var(--gold); }
a.row:not(.dir) .name { color: var(--link); }
.row.head { padding: 8px 16px; font: 600 .75rem var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.head button { all: unset; background: none; cursor: pointer; }
.head button:hover:not(:disabled), .head button[aria-pressed=true] { color: var(--gold); background: none; }
.head button[aria-pressed=true]::after { content: attr(data-dir); }
.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir .name::before { content: "▸ "; color: var(--gold); }
.num { text-align: right; font: .85rem var(--head); color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.err { color: #e56a6a; }

footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: .8rem; color: var(--muted); }
footer a { color: var(--gold); }
footer a:hover { text-decoration: underline; }
.pager { display: flex; gap: 8px; }

@media (max-width: 600px) {
  .row { grid-template-columns: 1fr 80px; }
  .row > :nth-child(3) { display: none; }
  .status { display: none; }
}
@media (prefers-reduced-motion: reduce) { .status::before { animation: none; } }

<main>
  <header>
    <svg role="img" aria-label="Auspatious" viewBox="0 0 48 53" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M0.00146484 34.1737V35.5669L14.7645 39.4901C15.1017 39.5793 15.4242 39.6198 15.7417 39.6085C16.0577 39.5987 16.3769 39.5371 16.7075 39.4252L47.9998 28.8995V27.9459H45.3857C44.9912 27.9459 44.6049 27.9004 44.2235 27.7999C43.8438 27.6993 43.4853 27.5436 43.1448 27.349L35.6594 23.0674L26.9888 31.6582C26.2882 32.3524 25.3879 32.8032 24.4041 32.9314C23.4204 33.0595 22.435 32.8535 21.5772 32.3637L13.9477 27.9994C13.4665 27.7237 12.9296 27.5696 12.373 27.5696C11.8149 27.5696 11.2796 27.7237 10.7984 27.9994L0.196254 34.0634L0.00473806 34.1737H0.00146484Z" fill="#FBC27B"/><path fill-rule="evenodd" clip-rule="evenodd" d="M0.00146484 36.9389V37.659C0.00146484 39.0473 0.695503 40.2394 1.91007 40.9335L22.0929 52.4794C23.3058 53.1735 24.6955 53.1735 25.9084 52.4794L46.0912 40.9335C47.3041 40.2394 47.9998 39.0473 47.9998 37.659V30.3008L47.6152 30.4305L17.1364 40.6838C16.6977 40.8313 16.2475 40.9189 15.7843 40.9351C15.3211 40.9497 14.866 40.893 14.4191 40.773L0.386132 37.0427L0.00146484 36.9406V36.9389Z" fill="#BD7248"/><path fill-rule="evenodd" clip-rule="evenodd" d="M0.00163723 27.7563V32.6478L0.193152 32.5375L10.129 26.853C10.8133 26.4605 11.5777 26.2415 12.3699 26.2415C13.1622 26.2415 13.925 26.4605 14.6108 26.853L22.2403 31.2173C22.8444 31.5628 23.5368 31.7104 24.2292 31.6195C24.9199 31.5287 25.5501 31.2076 26.0412 30.721L34.458 22.3816L34.5988 22.2421L25.6713 17.1349C25.1393 16.8317 24.5696 16.6792 24 16.6792C23.4304 16.6792 22.8607 16.8317 22.3287 17.1349L4.76006 27.1838C4.41795 27.3801 4.07912 27.5228 3.72719 27.6152C3.37198 27.7093 3.00532 27.7547 2.61574 27.7547H0L0.00163723 27.7563Z" fill="#17248C"/><path fill-rule="evenodd" clip-rule="evenodd" d="M22.0914 0.520609L1.90861 12.0664C0.695676 12.7606 0 13.9526 0 15.3409V26.431H2.61574C2.87437 26.431 3.13136 26.4034 3.3818 26.337C3.63225 26.2705 3.86959 26.1683 4.09385 26.0402L21.6625 15.9913C22.3762 15.5826 23.1734 15.3555 24 15.3555C24.8266 15.3555 25.6221 15.5826 26.3375 15.9913L43.9061 26.0402C44.1304 26.1683 44.3677 26.2705 44.6182 26.337C44.8686 26.4034 45.1256 26.431 45.3843 26.431H47.9984V15.3409C47.9984 13.9526 47.3043 12.7606 46.0897 12.0664L25.907 0.520609C24.694 -0.173536 23.3043 -0.173536 22.0914 0.520609Z" fill="#2B5CB5"/></svg>
    <h1>files<span>.</span>auspatious<span>.</span>com</h1>
    <div class="status" id="status">LOADING</div>
  </header>

  <div class="bar">
    <nav id="crumbs" aria-label="Path"></nav>
    <input id="q" type="search" placeholder="Filter by prefix" aria-label="Filter by prefix" autocomplete="off">
  </div>

  <div class="table" id="table" role="table" aria-live="polite"></div>

  <footer>
    <a id="bucket" target="_blank" rel="noopener">Bucket ↗</a>
    <div class="pager">
      <button id="prev" aria-label="Previous page">← Prev</button>
      <button id="next" aria-label="Next page">Next →</button>
    </div>
  </footer>
</main>

<script type="module">
const BUCKET = 'https://s3.ap-southeast-2.amazonaws.com/files.auspatious.com/'
const MASK = 'https://files.auspatious.com/' // public file URLs
const PAGE = 50
const $ = id => document.getElementById(id)
const enc = s => s.split('/').map(encodeURIComponent).join('/')
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`)

let prefix = '', token = '', tokens = [], items = [], next = '', sort = ['name', 1]

const bytes = n => {
  if (!n) return ''
  const i = Math.min(Math.floor(Math.log2(n) / 10), 4)
  return `${+(n / 1024 ** i).toFixed(i ? 1 : 0)} ${['B', 'KB', 'MB', 'GB', 'TB'][i]}`
}
const ago = d => {
  if (!d) return ''
  const s = (d - Date.now()) / 1000, f = new Intl.RelativeTimeFormat('en', { numeric: 'auto' })
  const [u, v] = [['year', 31536e3], ['month', 2592e3], ['day', 86400], ['hour', 3600], ['minute', 60]].find(([, v]) => Math.abs(s) >= v) || ['second', 1]
  return f.format(Math.round(s / v), u)
}

const text = (el, tag) => el.querySelector(tag)?.textContent

async function load() {
  const status = $('status')
  status.className = 'status'; status.textContent = 'LOADING'
  const p = new URLSearchParams({ 'list-type': 2, delimiter: '/', prefix, 'max-keys': PAGE })
  if (token) p.set('continuation-token', token)
  try {
    const res = await fetch(`${BUCKET}?${p}`)
    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml')
    if (!res.ok || !xml.querySelector('ListBucketResult')) throw Error(text(xml, 'Message') || `HTTP ${res.status}`)
    next = text(xml, 'NextContinuationToken') || ''
    items = [
      ...[...xml.querySelectorAll('CommonPrefixes')].map(e => text(e, 'Prefix'))
        .map(k => ({ dir: true, key: k, name: k.slice(0, -1).split('/').pop() + '/' })),
      ...[...xml.querySelectorAll('Contents')].map(e => ({ key: text(e, 'Key'), size: +text(e, 'Size'), date: new Date(text(e, 'LastModified')) }))
        .filter(f => f.key !== prefix && f.key !== 'index.html')
        .map(f => ({ ...f, name: f.key.split('/').pop() })),
    ]
    status.className = 'status ok'; status.textContent = `${items.length} ITEMS`
  } catch (e) {
    items = []; next = ''
    status.textContent = 'ERROR'
    $('table').innerHTML = `<div class="empty err">${esc(e.message)}</div>`
    return
  }
  render()
}

function render() {
  const dir = prefix.slice(0, prefix.lastIndexOf('/') + 1)
  const parts = dir.split('/').filter(Boolean)
  $('crumbs').innerHTML = ['', ...parts].map((n, i) =>
    `<a href="#${enc(parts.slice(0, i).join('/') + (i ? '/' : ''))}">${i ? esc(n) : '⌂ root'}</a>`).join('<i>/</i>')
  if (document.activeElement !== $('q')) $('q').value = prefix.slice(dir.length)
  $('bucket').href = `${BUCKET}?prefix=${enc(prefix)}`
  $('prev').disabled = !tokens.length
  $('next').disabled = !next

  const [col, d] = sort
  const rows = [...items].sort((a, b) =>
    b.dir - a.dir || d * (col === 'name' ? a.name.localeCompare(b.name, undefined, { numeric: true }) : (a[col] ?? 0) - (b[col] ?? 0)))
  const th = (c, l) => `<button data-sort="${c}" aria-pressed="${col === c}" data-dir="${d > 0 ? ' ↑' : ' ↓'}">${l}</button>`
  $('table').innerHTML = `<div class="row head">${th('name', 'Name')}<span class="num">${th('size', 'Size')}</span><span class="num">${th('date', 'Modified')}</span></div>` +
    (rows.map(r => `<a class="row${r.dir ? ' dir' : ''}" href="${r.dir ? '#' + enc(r.key) : MASK + enc(r.key)}">
      <span class="name" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="num">${bytes(r.size)}</span>
      <span class="num" title="${r.date?.toLocaleString() ?? ''}">${ago(r.date)}</span></a>`).join('') || '<div class="empty">Nothing here.</div>')
}

const go = () => { prefix = decodeURIComponent(location.hash.slice(1)); token = ''; tokens = []; load() }
addEventListener('hashchange', go)

$('table').onclick = e => {
  const b = e.target.closest('[data-sort]')
  if (b) { sort = [b.dataset.sort, sort[0] === b.dataset.sort ? -sort[1] : 1]; render() }
}
$('next').onclick = () => { tokens.push(token); token = next; load() }
$('prev').onclick = () => { token = tokens.pop(); load() }

let t
$('q').oninput = e => {
  const v = e.target.value
  e.target.ariaInvalid = v.includes('//') // S3 keys can't be meaningfully searched across slashes here
  clearTimeout(t)
  if (!v.includes('/')) t = setTimeout(() => { location.hash = '#' + enc(prefix.slice(0, prefix.lastIndexOf('/') + 1) + v) }, 300)
}

go()
</script>
